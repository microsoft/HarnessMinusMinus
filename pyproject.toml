[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chisel-jev"
version = "0.2.0"
description = "Jev-inspired CHISEL: typed decisions, bounded recovery, and modular rule evolution"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "PhiAgent-0 contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.0.3", "build==1.2.2.post1", "jsonschema==4.26.0"]

[project.urls]
Repository = "https://github.com/microsoft/AgentMinusMinus"

[tool.setuptools.packages.find]
include = ["chisel*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.setuptools.package-data]
"chisel.harness" = ["contracts/*.mjs"]
