name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev,analysis]'
      - run: python -m pytest
      - run: python tools/check_release.py --history
      - run: python scripts/verify_release.py
      - run: python scripts/check_self_contained.py
      - run: node pi-harnessmm/scripts/parity-check.mjs
      - run: node --test tests/*.test.mjs
      - run: node examples/guarded_reuse.mjs
      - run: python examples/partition.py
      - run: python examples/harness_boundaries.py
      - run: python reproduction/run_all.py
      - run: python -m build
      - run: python tools/check_release.py --distributions dist
